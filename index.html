<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de stage — Sage-femme</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e5659e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet SF">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf4f8;--surface:#ffffff;--surface2:#fff8fb;--border:#f2d6e3;--text:#3d2f37;--muted:#8f7683;
  --accent:#e5659e;--accent2:#f08db8;--deep:#d0488a;--soft:#fde3ee;--shadow:0 6px 24px rgba(214,102,152,.10);
  --r:18px;--r2:12px;--paper:#fffdfe;--rule:#f4dbe7;--h1:#c8437f;--ok:#4f9d74;--warn:#c9772f;
  --serif:"Lora",Georgia,"Times New Roman",serif;--disp:"Fraunces",Georgia,serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1419;--surface:#291b23;--surface2:#33222c;--border:#4a3140;--text:#f6e9f0;--muted:#c4a2b4;--accent:#f08db8;--accent2:#e5659e;--deep:#f2a5c6;--soft:#47293a;--shadow:0 6px 24px rgba(0,0,0,.35);--paper:#2c1e26;--rule:#4a3140;--h1:#f08db8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1419;--surface:#291b23;--surface2:#33222c;--border:#4a3140;--text:#f6e9f0;--muted:#c4a2b4;--accent:#f08db8;--accent2:#e5659e;--deep:#f2a5c6;--soft:#47293a;--shadow:0 6px 24px rgba(0,0,0,.35);--paper:#2c1e26;--rule:#4a3140;--h1:#f08db8;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--serif);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
::selection{background:var(--soft);color:var(--deep)}
.app{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100dvh}
/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100dvh;padding:26px 16px 18px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:18px;overflow-y:auto;z-index:30}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px;flex-wrap:wrap}
.brand b{font-family:var(--disp);font-size:21px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand b i{font-style:italic;font-weight:400;color:var(--accent)}
.brand small{display:block;width:100%;font-size:10px;letter-spacing:3px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:2px}
.searchbox{position:relative}
.searchbox input{width:100%;height:38px;border:1px solid var(--border);background:var(--surface2);border-radius:11px;padding:0 34px 0 32px;outline:none;font-size:13.5px}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.searchbox svg{position:absolute;left:10px;top:11px;width:16px;height:16px;color:var(--muted)}
.searchbox kbd{position:absolute;right:8px;top:9px;font-family:var(--serif);font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 5px;background:var(--surface)}
nav{display:grid;gap:2px;min-width:0}
.side>*{min-width:0}
.flist{min-width:0}
.cr2{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;padding:0;border-bottom:1px dashed var(--border)}
.cr2:hover{color:var(--accent)}
.nv{height:36px;display:flex;align-items:center;gap:9px;text-align:left;padding:0 10px;border:0;border-left:3px solid transparent;background:none;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer;font-size:14px;width:100%}
.nv:hover{background:var(--surface2);color:var(--text)}
.nv.on{background:var(--soft);color:var(--deep);border-left-color:var(--accent);font-weight:700}
.nv .ico{width:16px;height:16px;flex:0 0 auto;opacity:.85}
.nv .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
.nv.on .cnt{color:var(--deep)}
.nlab{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 10px 6px;border-top:1px solid var(--border);margin-top:6px}
.nlab:first-of-type{border-top:0;margin-top:0;padding-top:2px}
.flist{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;max-height:none}
.flist .fv{display:flex;align-items:center;gap:8px;padding:6px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:var(--muted);width:100%;min-width:0}
.flist .fv:hover{background:var(--surface2);color:var(--text)}
.flist .fv.on{background:var(--soft);color:var(--deep);font-weight:700}
.flist .fv .no{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--accent);min-width:18px}
.flist .fv .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.flist .fv .dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex:0 0 auto}
.flist .fv .dot.p{background:var(--accent)}
.flist .fv .dot.f{background:var(--ok)}
.sidefoot{margin-top:auto;display:grid;gap:7px;padding-top:12px;border-top:1px solid var(--border)}
.progmini{display:grid;gap:5px;padding:2px 2px 6px}
.progmini .pt{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.progmini .pt b{color:var(--accent)}
.pbar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(229,101,158,.16)}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .5s}
.sidefoot .row{display:flex;gap:6px}
.btn{height:36px;padding:0 12px;border:1px solid var(--border);background:var(--surface);color:var(--deep);border-radius:10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:.15s;font-size:13px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{height:30px;padding:0 9px;font-size:12px;border-radius:8px}
.btn.gh{background:none;border-color:transparent;color:var(--muted)}
.btn.gh:hover{background:var(--surface2);color:var(--text)}
.btn .ico{width:14px;height:14px}
/* ---------- main ---------- */
.main{min-width:0;padding:26px 34px 90px;max-width:1000px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.4px;flex:1;min-width:0}
.crumb b{color:var(--text);font-weight:600}
.crumb .sep{opacity:.5}
.top .save{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.top .save .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.mob{display:none}
/* cover */
.cover{position:relative;padding:6px 0 0}
.cvhead{display:flex;align-items:center;justify-content:space-between;border-top:2px solid var(--text);border-bottom:1px solid var(--border);padding:9px 0;font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cvhead .sf{font-family:var(--disp);font-size:15px;letter-spacing:1px;color:var(--deep)}
.cvtitle{margin:44px 0 0;font-family:var(--disp);font-weight:800;font-size:clamp(46px,8vw,86px);line-height:.98;letter-spacing:-2.5px}
.cvtitle i{display:block;font-style:italic;font-weight:400;font-size:.86em;letter-spacing:-1px;color:var(--deep);margin-top:2px}
.cvrule{width:120px;height:3px;background:var(--deep);margin:18px 0 14px;border-radius:2px}
.cvcat{font-family:var(--disp);font-size:clamp(20px,3vw,26px);letter-spacing:6px;font-weight:600;color:var(--text);text-transform:uppercase}
.cvsub{color:var(--muted);font-size:15.5px;max-width:34em;margin-top:8px;line-height:1.6}
.romans{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:42px 0 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:16px 0}
.romans button{background:none;border:0;text-align:left;cursor:pointer;color:var(--text);padding:0;font-family:var(--serif)}
.romans b{display:block;font-family:var(--disp);font-size:13px;color:var(--deep);letter-spacing:1px;margin-bottom:4px}
.romans span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.romans button:hover span{color:var(--accent)}
.prof{display:grid;grid-template-columns:1fr 1fr;gap:26px 34px;margin:36px 0 0}
.pf{border-bottom:1px solid var(--border);padding-bottom:5px}
.pf label{display:block;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.pf input{width:100%;border:0;background:none;outline:none;padding:3px 0;font-size:15.5px;font-family:var(--disp);font-weight:500}
.pf input:focus{border-bottom:1px solid var(--accent)}
.pf input::placeholder{color:var(--muted);opacity:.45;font-family:var(--serif);font-weight:400;font-size:14px}
.printfoot{display:none}
.cvfoot{display:flex;justify-content:space-between;gap:10px;border-top:2px solid var(--text);margin-top:44px;padding-top:8px;font-size:10px;letter-spacing:2.4px;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:26px 0 20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px}
.stat b{display:block;font-family:var(--disp);font-size:26px;font-weight:800;color:var(--accent);line-height:1.1}
.stat span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;letter-spacing:.2px}
.h2s{font-family:var(--disp);font-size:13px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.h2s:after{content:"";flex:1;height:1px;background:var(--border)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px 12px;cursor:pointer;display:grid;gap:5px;transition:.16s;position:relative;overflow:hidden}
.fcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.fcard .n{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--accent)}
.fcard .t{font-family:var(--disp);font-size:14.5px;font-weight:600;line-height:1.3;color:var(--text)}
.fcard .m{font-size:11px;color:var(--muted)}
.fcard .b{display:block;width:100%;margin-top:7px}
.fcard .b i{width:0}
.badge{position:absolute;top:10px;right:10px;width:17px;height:17px;border-radius:50%;display:none;place-items:center;font-size:10px;color:#fff;background:transparent}
.badge.done{display:grid}
.badge.done{background:var(--ok);border-color:var(--ok)}
/* fiche */
.fiche{padding-bottom:30px}
.eb{display:flex;justify-content:space-between;gap:12px;font-size:10px;letter-spacing:2.4px;text-transform:uppercase;font-weight:700;color:var(--muted);flex-wrap:wrap}
.eb .r{color:var(--accent)}
.fh1{font-family:var(--disp);font-size:clamp(28px,4vw,38px);font-weight:800;letter-spacing:-.8px;line-height:1.12;margin:10px 0 0}
.frule{width:64px;height:2.5px;background:var(--deep);margin:12px 0 14px;border-radius:2px}
.obj{font-style:italic;color:var(--muted);font-size:14.5px;max-width:62em;line-height:1.62}
.obj b{color:var(--text);font-style:normal;font-weight:700;letter-spacing:.4px;text-transform:uppercase;font-size:10.5px}
.sect{margin:30px 0 0}
.sect>h2{font-family:var(--disp);font-size:12px;letter-spacing:1.9px;text-transform:uppercase;font-weight:700;color:var(--text);margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:baseline}
.sect>h2 .num{color:var(--accent);font-size:12px;flex:0 0 auto}
.sect>h2 .tip{margin-left:auto;font-size:10px;letter-spacing:.6px;text-transform:none;color:var(--muted);font-family:var(--serif);font-weight:400}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.ff{display:grid;gap:3px;min-width:0}
.ff label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.3}
.ff input,.ff select{height:38px;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:0 10px;outline:none;width:100%;font-size:14px;min-width:0}
.ff input:focus,.ff select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft);background:var(--surface)}
.ff input::placeholder{color:var(--muted);opacity:.55}
.ta{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none;resize:vertical;font-family:var(--serif);font-size:14.5px;line-height:1.9;min-height:84px;background-image:repeating-linear-gradient(transparent,transparent calc(1.9em - 1px),var(--rule) calc(1.9em - 1px),var(--rule) 1.9em);background-attachment:local;background-position:0 10px}
.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.ta::placeholder{color:var(--muted);opacity:.55}
.hint{color:var(--muted);font-size:12.5px;line-height:1.55;margin:-2px 0 8px;font-style:italic}
.chks{display:grid;gap:12px}
.ckg{display:grid;gap:7px}
.ckg .l{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.cks{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:5px 14px}
.ck{display:flex;align-items:flex-start;gap:8px;font-size:14px;cursor:pointer;line-height:1.4;padding:2px 0}
.ck input{appearance:none;width:16px;height:16px;border:1.5px solid var(--border);border-radius:4px;flex:0 0 auto;margin:2px 0 0;cursor:pointer;background:var(--surface);display:grid;place-items:center;transition:.12s}
.ck input:checked{background:var(--accent);border-color:var(--accent)}
.ck input:checked:after{content:"";width:8px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ck:hover input{border-color:var(--accent2)}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
table.gt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:100%}
table.gt th{background:var(--surface2);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:8px 9px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
table.gt td{border-bottom:1px solid var(--border);padding:0;vertical-align:middle}
table.gt td+td,table.gt th+th{border-left:1px solid var(--border)}
table.gt td.ci:hover{background:var(--soft)}
table.gt tbody tr:hover td.rl{background:var(--surface2)}
table.gt tr:last-child td{border-bottom:0}
table.gt td.rl{padding:8px 10px;color:var(--text);font-size:12.8px;line-height:1.35;min-width:120px;background:var(--surface)}
table.gt td.ci{padding:0}
table.gt td.ci input,table.gt td.ci select{width:100%;height:36px;border:0;background:transparent;padding:0 8px;outline:none;font-size:13.5px;border-radius:0}
table.gt td.ci input:focus,table.gt td.ci select:focus{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
table.gt td.c{text-align:center}
table.gt td .mini{font-size:11.5px;color:var(--muted);line-height:1.3;display:block;padding:7px 9px}
.callout{border-left:3px solid var(--deep);background:var(--surface2);border-radius:0 12px 12px 0;padding:12px 16px;font-size:13.8px;line-height:1.6;color:var(--text)}
.callout.warn{border-left-color:var(--warn);background:linear-gradient(90deg,var(--soft),var(--surface2))}
.callout .l{display:block;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--deep);margin-bottom:5px}
.callout ul{margin:0;padding-left:17px;display:grid;gap:3px}
.callout li{margin:0}
.steps{counter-reset:st;display:grid;gap:9px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14px;line-height:1.55;align-items:start}
.steps li:before{content:counter(st);font-family:var(--disp);font-size:12px;font-weight:700;color:#fff;background:var(--accent);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.bul{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.bul li{position:relative;padding-left:16px;font-size:14px;line-height:1.5}
.bul li:before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent2)}
.riskgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rcell{border:1px solid var(--border);border-radius:14px;padding:13px 15px;background:var(--surface)}
.rcell .l{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:7px}
.rcell ul{margin:0;padding-left:15px;display:grid;gap:4px;font-size:13.4px;line-height:1.45}
/* scores */
.sc{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)}
.sc table{width:100%;border-collapse:collapse;font-size:13px}
.sc th{background:var(--surface2);font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);padding:8px 10px;text-align:left;font-weight:700;border-bottom:1px solid var(--border)}
.sc td{padding:6px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.sc tr:last-child td{border-bottom:0}
.sc td.it{font-size:13.2px;line-height:1.35}
.sc td.op{width:78px;text-align:center}
.sc td.op label{display:grid;place-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;padding:2px 0}
.sc td.op input{appearance:none;width:15px;height:15px;border:1.5px solid var(--border);border-radius:50%;background:var(--surface);cursor:pointer;display:grid;place-items:center}
.sc td.op input:checked{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.sc td.op input:checked+span{color:var(--deep);font-weight:700}
.sc td.op select{width:100%;min-width:118px;height:32px;border:1px solid transparent;background:var(--surface);border-radius:7px;padding:0 6px;font-size:12.4px;outline:none;color:var(--text)}
.sc td.op select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.sc .tot{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700;flex-wrap:wrap}
.sc table.gt th{position:static}
.sc .tot b{font-family:var(--disp);font-size:20px;color:var(--accent);letter-spacing:0}
.sc .tot .vl{font-size:9.5px;letter-spacing:1px;color:var(--muted);margin-right:5px;font-weight:700}
.sc .tot .vl:after{content:":"}
.sc .tot .vs{opacity:.35;margin:0 4px;font-size:14px}
.sc .tot .vd{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--text);font-family:var(--serif);font-size:13px}
/* seen toggle + fiche footer */
.done-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:32px 0 0;padding:13px 16px;border:1px dashed var(--border);border-radius:12px;background:var(--surface2)}
.done-row .lbl{flex:1;font-size:12px;letter-spacing:.4px;color:var(--muted);min-width:180px}
.sw{position:relative;width:44px;height:24px;border-radius:99px;background:var(--border);border:0;cursor:pointer;flex:0 0 auto;transition:.18s;padding:0}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}.sw.on:after{left:23px}
.visa{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
/* notes */
.notes{display:grid;gap:14px}
.note{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--surface);display:grid;gap:8px}
.note .nh{display:flex;gap:8px;align-items:center}
.note .nh input{flex:1;border:0;background:none;outline:none;font-family:var(--disp);font-weight:600;font-size:16px;color:var(--text);padding:2px 0;min-width:0}
.note .nh input:focus{border-bottom:1px solid var(--accent)}
.note .meta{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.note textarea{border:0;background:transparent;padding:0;min-height:90px;background-image:repeating-linear-gradient(transparent,transparent calc(1.85em - 1px),var(--rule) calc(1.85em - 1px),var(--rule) 1.85em);background-position:0 4px;line-height:1.85}
.note textarea:focus{box-shadow:none;border:0}
/* misc */
.empty{color:var(--muted);font-size:13.5px;font-style:italic;padding:14px 0}
.pill{display:inline-block;background:var(--soft);color:var(--deep);border-radius:99px;padding:2px 9px;font-size:10.5px;font-weight:700;letter-spacing:.4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.kb{position:fixed;inset:0;z-index:120;background:rgba(40,18,30,.55);backdrop-filter:blur(3px);display:none;padding:10vh 16px 16px;justify-content:center;align-items:flex-start}
.kb.on{display:flex}
.kbp{width:min(560px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 24px 60px rgba(60,20,40,.3);overflow:hidden;max-height:74vh;display:flex;flex-direction:column}
.kbp input{height:50px;border:0;border-bottom:1px solid var(--border);background:none;padding:0 16px;outline:none;font-size:15px;width:100%}
.kbl{overflow-y:auto;padding:6px}
.kbi{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;cursor:pointer;width:100%;border:0;background:none;text-align:left;font-size:13.5px;color:var(--text)}
.kbi:hover,.kbi.sel{background:var(--soft);color:var(--deep)}
.kbi .no{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--accent);min-width:22px}
.kbi .ty{margin-left:auto;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.secband{display:flex;align-items:center;gap:14px;margin:38px 0 18px}
.secband .rn{font-family:var(--disp);font-size:54px;font-weight:400;color:var(--soft);line-height:.8;letter-spacing:-2px}
.secband h1{margin:0;font-family:var(--disp);font-size:clamp(26px,3.4vw,34px);font-weight:800;letter-spacing:-.6px}
.secband p{margin:2px 0 0;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
body.embed .app{grid-template-columns:1fr}
body.embed .side{position:fixed;left:0;top:0;width:282px;height:100dvh;transform:translateX(-103%);transition:transform .22s;box-shadow:var(--shadow);z-index:60}
body.embed .side.open{transform:none}
body.embed .mob{display:inline-flex}
@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:280px;transform:translateX(-102%);transition:.22s;box-shadow:var(--shadow);height:100dvh}
  .side.open{transform:none}
  .mob{display:inline-flex}
  .main{padding:18px 16px 80px}
  .stats{grid-template-columns:1fr 1fr}
  .prof{grid-template-columns:1fr}
  .riskgrid{grid-template-columns:1fr}
  .visa{grid-template-columns:1fr}
  .romans{grid-template-columns:1fr 1fr;gap:14px}
  .sc{overflow-x:auto}
}
@media(max-width:760px){
  .crumb{display:none}
  .top{gap:6px}
  .top .save{font-size:10.5px}
}
@media(max-width:560px){
  .fg{grid-template-columns:1fr 1fr}
  .cks{grid-template-columns:1fr 1fr}
  .cvhead{font-size:8.5px;letter-spacing:1.6px}
  body{font-size:14.5px}
}
@media print{
  @page{size:A4;margin:13mm 12mm 19mm}
  .side,.top,.toast,.kb,.done-row,.noprint{display:none!important}
  .app{display:block}
  body{background:#fff;font-size:10.5pt;color:#2b2126}
  .main{padding:0;max-width:none}
  .fh1{font-size:22pt}
  .sect{margin-top:15px;break-inside:auto}
  .ff input,.ff select,.ta,.note textarea,.note,table.gt td.ci input{border-color:#e7cfd9;background:#fff!important;background-image:none!important}
  .ta{min-height:auto;height:auto;overflow:visible;field-sizing:content}
  .tw{overflow:visible;break-inside:auto}
  table.gt{font-size:8.6pt}
  table.gt th{font-size:7.4pt;position:static}
  .callout,.sc,.visa,.steps li,table.gt tr{break-inside:avoid}
  .ff,.note,.rt{break-inside:avoid}
  input::placeholder,textarea::placeholder{color:transparent!important}
  .printfoot{display:flex!important;position:fixed;bottom:0;left:0;right:0;justify-content:space-between;gap:10px;font-size:7.6pt;letter-spacing:1.6px;text-transform:uppercase;color:#8f7683;border-top:1px solid #e7cfd9;padding-top:4px;background:#fff}
  .sc td.op{padding:2px 6px}
  .sc td.op select{border:0;background:none;appearance:none;padding:0;min-width:0;height:auto;font-size:8.6pt}
  .sc .tot{border-top:1px solid #e7cfd9}
  .cover{page-break-after:always}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

{id:'10',t:'Hémorragie du post-partum',s:'Natal · Urgence',
 o:'Savoir reconnaître, alerter et agir dans l’ordre. Cette fiche se remplit à chaud, ou se relit à froid après une situation vécue — jamais pendant l’urgence. La fiche R12 en donne la version « protocole ».',b:[
 {k:'callout',h:'Définition et repères',
  p:'Hémorragie du post-partum : perte sanguine d’environ 500 mL ou plus dans les 24 heures qui suivent l’accouchement ; forme sévère à partir de 1 000 mL ou en présence de signes de mauvaise tolérance. Le protocole national algérien retient 1 000 mL ou une perte accompagnée de signes d’hypovolémie : retenir surtout qu’une perte mal tolérée est une HPP, quel que soit le chiffre. Se référer au protocole affiché dans l’unité.'},
 {k:'table',h:'01 · Chronologie des actions',n:6,first:'input',

 {k:'steps',h:'02 · Séquence attendue',s:[
  'Appeler à l’aide, annoncer clairement « hémorragie du post-partum » et l’heure.',
  'Évaluer la perte : sac de recueil ou pesée, ne pas se fier à l’impression visuelle.',
  'Vérifier les constantes, poser deux voies veineuses de bon calibre, débuter le remplissage.',
  'Massage utérin, vérifier la vacuité vésicale, rechercher une déchirure ou un hématome.',
  'Administrer l’utérotonique selon le protocole du service, puis les traitements de deuxième intention.',
  'Réaliser les prélèvements, vérifier le groupe et la réserve de sang, surveiller la diurèse.',
  'Informer la patiente à chaque étape, rester auprès d’elle, installer le nouveau-né au sein ou au chaud.',

/* ---------------- II · SITUATIONS À RISQUE ---------------- */
const CR=[
{id:'R1',t:'HTA et pré-éclampsie',cat:'Périnatal · Tension',
 intro:'HTA de la grossesse : PAS ≥ 140 mmHg et/ou PAD ≥ 90 mmHg. Pré-éclampsie : HTA associée à une protéinurie ≥ 300 mg/24 h (ou un ratio protéinurie/créatininurie ≥ 30 mg/mmol) apparue après 20 SA. Elle complique 5 à 10 % des grossesses et reste la première cause de morbidité maternelle et fœtale.',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['TA ≥ 140/90 en consultation, à confirmer hors du cabinet','Céphalées, troubles visuels, acouphènes','Œdèmes, prise de poids rapide','Protéinurie à la bandelette ≥ 1 +','Antécédents de pré-éclampsie, HTA chronique, diabète, néphropathie','Grossesse multiple, primiparité, changement de partenaire']},
  {l:'Vérifier — constantes, examen, bilan',u:['TA aux deux bras, brassard adapté, après 5 min de repos','Bandelette urinaire puis protéinurie des 24 h ou ratio P/Cr','NFS-plaquettes, LDH, haptoglobine, schizocytes','Créatinine, uricémie, ASAT-ALAT, bilirubine, TP-TCA-fibrinogène','Groupe, rhésus, RAI','ERCF, échographie obstétricale et Doppler']},
  {l:'Hospitaliser ou transférer',u:['PAS ≥ 160 et/ou PAD ≥ 110 mmHg','Signes neurologiques persistants, ROT vifs et polycinétiques','Barre épigastrique ou douleur de l’hypochondre droit','Dyspnée, douleur thoracique, œdème aigu du poumon','Oligurie ≤ 500 mL/24 h, cytolyse > 2N, plaquettes < 100 000','Suspicion d’hématome rétroplacentaire']},
  {l:'Surveiller et tracer',u:['TA et pouls selon protocole, diurèse, poids','Protéinurie, plaquettes, transaminases, créatinine','RCF et mouvements actifs fœtaux','Réflexes ostéotendineux si sulfate de magnésium','Post-partum : poursuivre la surveillance tensionnelle']}],
 steps:['Poser une voie veineuse, bilan HTA et pré-opératoire, PA automatisée, monitoring fœtal selon le terme.',
  'Objectif : PAS < 160 mmHg et PAD entre 85 et 100 mmHg ; éviter les à-coups tensionnels.',
  'Voie orale en première intention : alphaméthyldopa, labétalol ou nicardipine (nifédipine sublinguale contre-indiquée).',
  'Si signe de gravité : labétalol IV en première intention, puis nicardipine ou urapidil, en titration.',
  'Contre-indications : IEC, ARA II et diurétiques.',
  'Prévention : aspirine 150 mg chez les patientes à haut risque, de 11–14 SA jusqu’à 35 SA au moins.',
  'Bétaméthasone 12 mg × 2 à 24 h d’intervalle si pré-éclampsie avant 34 SA.'],
 pat:'Une tension élevée gêne le passage du sang vers le placenta : c’est pourquoi on surveille souvent, même sans symptôme. Signaler immédiatement un mal de tête qui ne cède pas, des moucherons devant les yeux ou une douleur en barre. Pas de pilule œstroprogestative dans les six semaines ; contraception non hormonale si la tension n’est pas stabilisée.'},

{id:'R2',t:'Pré-éclampsie sévère, éclampsie, HELLP',cat:'Périnatal · Urgence vitale',
 intro:'Pré-éclampsie sévère : HTA sévère et/ou atteinte viscérale. Éclampsie : crise convulsive tonicoclonique dans un contexte de pathologie hypertensive de la grossesse. HELLP : hémolyse (LDH > 600 UI/L), ASAT-ALAT ≥ 2N et plaquettes < 100 000/mm³.',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Céphalées intenses résistantes au traitement','Troubles visuels ou auditifs persistants','Douleur épigastrique « en barre », hypochondre droit','Convulsions, confusion, déficit neurologique','Dyspnée, douleur thoracique, oligurie','Saignement noirâtre avec utérus hypertonique']},
  {l:'Vérifier — constantes, examen, bilan',u:['Scope : PA, FC, SpO2, conscience','Plaquettes, LDH, haptoglobine, schizocytes','ASAT-ALAT, bilirubine, créatinine (doublement ou > 90 µmol/L)','Protéinurie > 3 g/24 h, fibrinogène','ERCF, échographie, Doppler']},
  {l:'Urgence — alerter sans délai',u:['Éclampsie : la perfusion de sulfate de magnésium est indiquée d’emblée','Toute HTA ≥ 180/120 mmHg','HELLP syndrome, hématome rétroplacentaire','Œdème aigu du poumon, insuffisance rénale aiguë','HTA sévère non contrôlée par 2 ou 3 antihypertenseurs']},
  {l:'Surveiller et tracer',u:['Diurèse horaire, ROT, conscience, fréquence respiratoire','Plaquettes, LDH, transaminases deux fois par jour','RCF en continu, mouvements actifs','Heure et dose de chaque molécule administrée']}],
 steps:['Débuter ou majorer le traitement : objectif PAS < 160 et PAD < 110 mmHg.',
  'Signe de gravité : labétalol IVSE en première intention (bolus de 20, 40, 80 puis 80 mg), ou nicardipine, ou urapidil.',
  'Sulfate de magnésium : 4 g en perfusion sur 20 min, puis 1 à 2 g/h pendant 24 h.',
  'Surveiller les ROT, la conscience, la diurèse et la fréquence respiratoire ; gluconate de calcium en cas de surdosage.',
  'Terminaison : après 34 SA si forme sévère ; entre 24 et 34 SA, poursuite sous surveillance rapprochée ; avant 24 SA, discuter une interruption pour sauvetage maternel.',
  'Critères maternels de terminaison : éclampsie, OAP, HRP, HELLP, insuffisance rénale, HTA non contrôlée.',
  'Envoyer le placenta en anatomopathologie ; pas d’œstroprogestatif pendant six semaines.'],
 pat:'Le sulfate de magnésium protège du risque de convulsions ; il donne une sensation de chaleur et une lourdeur des jambes, ce n’est pas dangereux. La décision d’accoucher est une décision d’équipe : elle sera expliquée au fur et à mesure. Après l’accouchement, la tension reste surveillée plusieurs semaines.'},

{id:'R3',t:'Métrorragies du troisième trimestre',cat:'Périnatal · Hémorragie',
 intro:'Saignement survenant après 28 SA jusqu’à la naissance, à rapprocher dès 20 SA. Environ 5 % des grossesses. Le diagnostic différentiel essentiel oppose le placenta praevia et l’hématome rétroplacentaire (HRP).',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Saignement rouge, répété, indolore, utérus souple : évoquer un placenta praevia','Douleur, utérus hypertonique, saignement noirâtre : évoquer un HRP','Contexte d’HTA, de pré-éclampsie, d’ATCD d’HRP ou de traumatisme','Présentation haute ou vicieuse, BCF audibles (PP)','BCF absents ou irréguliers, état maternel contrastant avec un saignement minime (HRP)']},
  {l:'Vérifier — constantes, examen, bilan',u:['Constantes et recherche de signes de choc','Échographie : localisation du placenta, hématome, vitalité','ERCF','Groupe-RAI, NFS, TP-TCA, fibrinogène, D-Dimères','Créatinine, glycémie, ionogramme']},
  {l:'Règle d’or et urgence',u:['Aucun toucher vaginal avant d’avoir éliminé un placenta praevia','Ne jamais faire de toucher vaginal avant l’échographie','Saignement abondant avec état de choc : extraction ou chirurgie urgente','Fœtus mort avec HRP sévère et troubles de la crase','Vasa praevia : césarienne en extrême urgence']},
  {l:'Surveiller et tracer',u:['Quantification du saignement, TA, pouls, diurèse','BCF en continu','Hémostase et plaquettes','Tonus et hauteur utérine','Nouveau-né : pâleur, anémie']}],
 steps:['Mettre en condition : deux voies de bon calibre, remplissage, oxygène, réchauffer la patiente.',
  'Commander du sang, installer le monitoring maternel et fœtal, noter l’heure de début.',
  'Échographie pour localiser le placenta ; prévenir le bloc et l’anesthésiste.',
  'Choc ou saignement abondant : extraction ou césarienne urgente, réanimation en parallèle.',
  'HRP sévère avec décès fœtal : rupture artificielle des membranes et Syntocinon ; césarienne si le travail ne progresse pas ou si la crase se dégrade.',
  'Placenta praevia recouvrant : césarienne. Bord à plus de 2 cm de l’orifice interne chez une patiente stable : voie basse possible.',
  'Vasa praevia : césarienne en extrême urgence.',
  'Anti-D 300 µg si rhésus négatif ; surveiller la délivrance et le post-partum (hémorragie, coagulation).'],
 pat:'On ne fait pas d’examen interne tant que l’on ne sait pas où est le placenta : c’est une précaution, pas un refus de s’occuper de vous. Si le saignement reprend à la maison, il faut revenir sans attendre, même la nuit. La césarienne sera décidée selon la position du placenta et l’état du bébé.'},

{id:'R4',t:'Diabète et grossesse',cat:'Périnatal · Métabolique',
 intro:'Diabète pré-gestationnel (type 1 ou 2, connu ou découvert pendant la grossesse, persistant après) ; diabète gestationnel apparu pendant la grossesse. L’insulinorésistance s’installe nettement à partir de 20 SA et fait augmenter les besoins en insuline.',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['ATCD de diabète gestationnel ou de macrosomie','Âge ≥ 35 ans, IMC ≥ 25 kg/m²','Diabète de type 2 chez un apparenté du premier degré','Syndrome des ovaires polykystiques','Macrosomie, hydramnios, RCIU inexpliqué','Infections urinaires ou mycoses vaginales récidivantes']},
  {l:'Vérifier — constantes, examen, bilan',u:['Glycémie à jeun ; HGPO si facteurs de risque (au 6e mois)','HbA1c, ECBU, microalbuminurie','Fond d’œil, créatinine, TA à chaque trimestre','Échographie : 22-24 SA, 32-34 SA, puis 36-37 SA','Mouvements actifs et hauteur utérine à chaque consultation']},
  {l:'Signes de déséquilibre',u:['Hypoglycémies répétées, cétonurie','Macrosomie (EPF > 4 250 g) ou hydramnios','RCIU ou pré-éclampsie surajoutés','HbA1c élevée, glycémies hors objectif malgré le traitement']},
  {l:'Surveiller et tracer',u:['Carnet d’autosurveillance, observance, cétonurie','Croissance fœtale, LA, mouvements actifs','TA et protéinurie (pré-éclampsie)','Post-partum : glycémie du nouveau-né, alimentation, contraception']}],
 steps:['Consultation préconceptionnelle : HbA1c < 6,5 %, acide folique 0,4 mg/j trois mois avant, aspirine 100-160 mg avant 16 SA.',
  'Relais des antidiabétiques oraux par insuline ; concertation diabétologue, obstétricien, pédiatre et diététicien.',
  'Autosurveillance glycémique : à jeun et 2 h après chaque repas ; objectifs < 0,95 g/L et < 1,20 g/L.',
  'Ration ≥ 1 800 kcal (1 600 si obésité), trois repas et trois collations, 30 min d’exercice après chaque repas.',
  'Surveillance : HbA1c tous les deux mois, ECBU et microalbuminurie mensuels, fond d’œil chaque trimestre.',
  'Terme cible 39 SA ; déclenchement à 39 SA si diabète mal équilibré ou retentissement fœtal.',
  'Césarienne programmée si EPF > 4 250 g (4 500 g selon les antécédents).',

{id:'R5',t:'Retard de croissance intra-utérin',cat:'Périnatal · Croissance',

  {l:'Extraction à discuter',u:['Diastole ombilicale nulle ou flux inverse','Vasodilatation cérébrale','RCF non oscillant < 5 bpm pendant plus de 40 min ou décélérations répétées','Onde « a » nulle ou inversée au ductus venosus']},

CR.push(

  {l:'Surveiller et tracer',u:['Contractions par heure, BCF, température, écoulement','Col si point d’appel','NFS-CRP, prélèvements','Tolérance de la tocolyse : pouls, TA, dyspnée']}],

{id:'R7',t:'Rupture prématurée des membranes',cat:'Périnatal · Infection',

  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Écoulement clair, incolore, indolore, continu ; parfois intermittent','Diminution de la hauteur utérine','Positions irrégulières du fœtus : risque de procidence du cordon','Fièvre, contractions douloureuses, liquide purulent : chorioamniotite']},
  {l:'Vérifier — constantes, examen, bilan',u:['Examen au spéculum stérile, non lubrifié (manœuvre de Tarnier)','Pas de toucher vaginal s’il n’y a pas de contractions','Tests IGFBP-1 ou PAMG-1 si doute','NFS-CRP, prélèvement vaginal, ECBU, hémocultures si fièvre','Échographie : liquide amniotique, présentation, placenta ; ERCF selon le terme']},
  {l:'Chorioamniotite',u:['Fièvre > 38 °C avec au moins deux signes : utérus douloureux, LA purulent, tachycardie fœtale > 160','Procidence du cordon','Métrorragies associées','Contractions régulières installées']},
  {l:'Surveiller et tracer',u:['Température trois fois par jour, pouls, contractions','Aspect et odeur du liquide','NFS-CRP hebdomadaire, ILA hebdomadaire','RCF, mouvements actifs','Noter l’heure de la rupture et l’aspect du liquide']}],

{id:'R8',t:'Grossesse prolongée',cat:'Périnatal · Terme',
 intro:'Grossesse prolongée au-delà de 41 SA + 0 j ; terme dépassé à partir de 42 SA + 0 j. Le risque de mortalité périnatale augmente, avec oligoamnios, anomalies du rythme, émission méconiale et macrosomie.',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Terme calculé par la LCC entre 11 et 14 SA, ou DDR fiable','Aucun signe de travail après 41 SA','Diminution des mouvements actifs','Hauteur utérine stable ou en baisse','Contractions irrégulières, faux travail']},
  {l:'Vérifier — constantes, examen, bilan',u:['Vérifier la datation : LCC, DDR, échographie du premier trimestre','Hauteur utérine, poids, TA, bandelette urinaire','RCF et mouvements actifs','Échographie : plus grande citerne, EPF, liquide amniotique','Score de Bishop si un déclenchement est envisagé']},
  {l:'Signes d’alerte fœtale',u:['Diminution des mouvements actifs','RCF non rassurant','Plus grande citerne < 2 cm (oligoamnios)','Liquide méconial','Apparition d’une HTA ou d’une protéinurie']},
  {l:'Surveiller et tracer',u:['Mouvements actifs, RCF, liquide amniotique','Contractions et progression du travail','Aspect du liquide à la rupture','Adaptation du nouveau-né : tonus, cri, coloration']}],
 steps:['Vérifier la datation : c’est elle qui décide, pas l’impression clinique.',
  'À partir de 41 SA : surveillance fœtale deux à trois fois par semaine (mouvements, RCF, échographie).',
  'Plus grande citerne < 2 cm : envisager l’accouchement.',
  'Ne pas utiliser le Doppler ni le score de Manning pour surveiller une grossesse prolongée.',
  'Proposer un déclenchement à 41 SA selon le score de Bishop et le protocole du service.',
  'Pendant le travail : monitorage continu, surveillance du liquide, présence pédiatrique.',
  'Prévenir l’inhalation méconiale : aspiration douce, pas de désobstruction systématique.',
  'Surveiller le post-partum : hémorragie, lésions périnéales, endométrite.'],
 pat:'Le terme est une date, pas une urgence : on surveille de près et on décide ensemble du moment. Compter les mouvements chaque jour et venir si le bébé bouge moins. Un déclenchement est proposé parce que le placenta devient moins efficace après 41 semaines.'},

{id:'R9',t:'Utérus cicatriciel',cat:'Obstétrique · Cicatrice',
 intro:'Utérus portant une ou plusieurs cicatrices myométriales : césarienne le plus souvent, mais aussi myomectomie, perforation ou hystéroplastie. Grossesse à haut risque de rupture utérine pour la mère et le fœtus.',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['ATCD de césarienne, de myomectomie, de perforation utérine','Délai inférieur à six mois depuis la césarienne','Présentation autre que le sommet','Placenta antérieur bas inséré : rechercher un placenta accreta','Douleur utérine, saignement, tachycardie pendant le travail']},
  {l:'Vérifier — constantes, examen, bilan',u:['Compte rendu opératoire : type d’incision, suites, indication','Échographie : épaisseur de la cicatrice, insertion placentaire','Recherche de placenta accreta si placenta praevia antérieur','Consultation d’anesthésie, groupe et RAI','Dossier obstétrical complet']},
  {l:'Signes de pré-rupture',u:['Douleur utérine continue ou en coup de poignard','Métrorragies','Tachycardie maternelle, malaise','Anomalies du RCF, perte du tonus utérin']},
  {l:'Surveiller et tracer',u:['Cicatrice : douleur, sensibilité','Contractions, RCF, saignement','TA et pouls maternels','Délivrance et post-partum']}],

  'Épreuve de travail possible si : une seule cicatrice segmentaire, suites simples, pas de malformation, pas de surdistension, présentation céphalique, accord de la patiente, équipe et bloc disponibles.',

{id:'R10',t:'Fièvre et infection en cours de grossesse',cat:'Périnatal · Infection',
 intro:'Toute fièvre ≥ 38 °C (ou < 36 °C avec frissons). Chorioamniotite ou infection intra-utérine : hyperthermie > 38 °C associée à au moins deux signes — utérus douloureux, liquide purulent, tachycardie fœtale > 160 bpm.',

  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Fièvre, frissons, douleurs pelviennes','Écoulement de liquide, leucorrhées, prurit','Signes ORL, digestifs, urinaires ou neurologiques','Geste invasif récent : cerclage, amniocentèse, biopsie choriale','Tachycardie fœtale, diminution des mouvements']},
  {l:'Vérifier — constantes, examen, bilan',u:['Température confirmée à 1 ou 2 heures d’intervalle','NFS-CRP, hémocultures, ECBU, prélèvements vaginaux','Sérologies selon le contexte (toxoplasmose, CMV, rubéole)','Échographie et RCF','Recherche du foyer : ORL, urinaire, digestif, cutané']},
  {l:'Urgence infectieuse',u:['Fièvre + contractions douloureuses + liquide purulent + tachycardie fœtale','Fièvre pendant le travail','Signes de choc : hypotension, marbrures, confusion','Épisode pseudo-grippal avec fromages non pasteurisés (listériose)']},

  'En travail : prélèvements puis antibiothérapie à large spectre ; extraction selon l’état maternel et fœtal.',
  'Chorioamniotite : antibiothérapie IV, utérotoniques, extraction ; prévenir le pédiatre.',
  'Pas de tocolyse en cas d’infection.',
  'Antipyrétiques, réhydratation, surveillance rapprochée.',
  'Adapter l’antibiothérapie à l’antibiogramme, réévaluer à 48 h.',
  'Nouveau-né : prélèvements, surveillance, antibiothérapie si indiquée.',

{id:'R11',t:'Anémie et grossesse',cat:'Périnatal · Hématologie',
 intro:'Selon l’OMS : hémoglobine < 11 g/dL pendant la grossesse, < 10 g/dL en post-partum ; anémie sévère si < 8 g/dL. Une Hb maternelle < 9 g/dL augmente le risque d’accouchement prématuré, de RCIU et de mort fœtale in utero ; l’objectif est une Hb entre 9,5 et 11,5 g/dL.',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Pâleur, tachycardie, vertiges, hypotension','Dyspnée d’effort puis de repos, céphalées','Fatigue inhabituelle, baisse des performances','Multiparité, grossesses rapprochées, contexte socio-économique difficile','Placenta praevia, saignement chronique']},
  {l:'Vérifier — constantes, examen, bilan',u:['NFS, VGM, réticulocytes','Ferritine, coefficient de saturation','Électrophorèse de l’hémoglobine','Folates et vitamine B12','Recherche d’un saignement occulte']},
  {l:'Anémie sévère ou mal tolérée',u:['Hb < 8 g/dL','Dyspnée de repos, tachycardie, hypotension','Drépanocytose ou thalassémie connue','Saignement actif associé']},

  'Fer oral 80 à 160 mg/j, à distance des repas, avec de la vitamine C.',
  'Fer parentéral si échec, intolérance, malabsorption, anémie sévère ou correction rapide nécessaire : 200 à 300 mg, à renouveler selon les besoins.',
  'Fer injectable contre-indiqué en cas d’hémoglobinopathie, d’atteinte hépatique ou de surcharge en fer.',
  'Arrêter le fer oral pendant le traitement parentéral, le reprendre au 5e jour avec l’acide folique.',
  'Transfusion si anémie sévère mal tolérée, ou en post-partum avec signes de choc.',
  'Contrôler l’efficacité : NFS à 7-10 jours, ferritine après 4 semaines.',
  'Prévenir l’hémorragie du post-partum : utérotoniques, information, surveillance.'],
 pat:'Le fer se prend mieux à jeun, avec un jus d’agrume, et loin du thé et du café. Les selles noires sont normales avec le fer : ce n’est pas du sang. Une anémie corrigée diminue le risque d’accouchement prématuré et de saignement mal toléré.'}
);

CR.push(
{id:'R12',t:'Hémorragie du post-partum',cat:'Natal · Hémorragie',
 intro:'Perte sanguine ≥ 1 000 mL ou perte accompagnée de signes d’hypovolémie dans les 24 h suivant l’accouchement, quel que soit le mode (protocole national). En pratique, toute perte supérieure à 500 mL ou mal tolérée doit déclencher la même réponse immédiate.',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Saignement abondant, caillots, utérus mou et mal rétracté','Pâleur, sueurs, tachycardie, hypotension, angoisse','Atonie utérine (70 %), rétention placentaire, traumatisme de la filière, coagulopathie','Facteurs de risque : travail prolongé, ocytociques, chorioamniotite, multiparité, surdistension','Situation à risque de coagulopathie : pré-éclampsie, HRP, MFIU, sepsis']},
  {l:'Vérifier — constantes, examen, bilan',u:['Quantifier : sac de recueil ou pesée, jamais l’impression','TA, pouls, saturation, conscience, temps de recoloration','Utérus (tonus, hauteur), vessie, filière génitale','NFS, TP-TCA, fibrinogène, groupe (deuxième détermination)','Index de choc : fréquence cardiaque / PAS']},
  {l:'Alerter immédiatement',u:['Heure de début + appel de toute l’équipe','Signes de choc hémorragique : transfusion et bloc','Utérus non rétracté malgré les utérotoniques','Saignement persistant après révision et sutures','Troubles de la coagulation']},
  {l:'Surveiller et tracer',u:['Saignement, TA, pouls, diurèse horaire','Plaquettes, fibrinogène, Hb','Tonus utérin et hauteur','Coloration, conscience, température']}],

{id:'R13',t:'Complications du post-partum',cat:'Post-natal · Suites de couches',
 intro:'Le post-partum s’étend sur six semaines. Les complications sont hémorragiques (précoces ou tardives), infectieuses (endométrite), thrombo-emboliques et psychiatriques. L’endométrite est la première cause de fièvre du post-partum, souvent entre le 3e et le 5e jour.',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Fièvre 38,5 à 40 °C, pouls accéléré, altération de l’état général','Douleurs pelviennes, utérus mou et sensible à la mobilisation','Lochies fétides, parfois hémorragiques','Saignement tardif : après 24 h et jusqu’à 12 semaines','Douleur du mollet, dyspnée, douleur thoracique','Tristesse, insomnie, ambivalence, culpabilité']},
  {l:'Vérifier — constantes, examen, bilan',u:['Température, pouls, TA, examen des membres inférieurs','Examen de l’utérus, des lochies, du périnée et de la cicatrice','Prélèvements de lochies, hémocultures si fièvre > 38,5 °C, ECBU','NFS-CRP, échographie pelvienne','EPDS si doute sur l’humeur ; recherche de signes de thrombose']},
  {l:'Urgences selon le tableau',u:['Sepsis : hypotension, marbrures, confusion','Thrombophlébite pelvienne ou embolie pulmonaire','Hémorragie tardive abondante','Utérus nécrotique','Idées suicidaires ou infanticides']},
  {l:'Surveiller et tracer',u:['Température, lochies, involution utérine','Douleur, mobilité, signes respiratoires','Humeur, sommeil, lien au bébé','Alimentation et état du nouveau-né']}],
 steps:['Endométrite : prélèvements puis antibiothérapie IV à large spectre (clindamycine 900 mg/8 h + gentamicine 3 mg/kg/j, ou amoxicilline-acide clavulanique 1 g/8 h, ou céphalosporine de 3e génération).',
  'Utérotoniques indispensables (ocytocine, misoprostol) pour assurer l’écoulement des lochies.',
  'Réévaluer à 48 h ; poursuivre jusqu’à 24-48 h d’apyrexie ; relais per os 7 à 10 jours si bactériémie ; métronidazole si persistance.',
  'Échec à 5 jours : TDM ou IRM à la recherche d’une thrombophlébite pelvienne, puis anticoagulation.',
  'Utérus nécrotique et septique : hystérectomie subtotale avec antibiothérapie.',
  'Hémorragie tardive : chercher une endométrite ; retour de couches hémorragique : œstrogènes en l’absence de contre-indication.',
  'Thrombo-embolie : alerter, anticoaguler selon le protocole.',
  'Dépression du post-partum : écouter, coter l’EPDS, orienter, organiser le relais.'],
 pat:'Une fièvre après l’accouchement n’est jamais normale : il faut consulter le jour même. Une tristesse qui dure, une impossibilité à dormir ou à s’occuper du bébé se soignent : en parler n’est pas une plainte. Une douleur du mollet ou un essoufflement impose un avis urgent.'},

{id:'R14',t:'Dystocie des épaules',cat:'Natal · Expulsion',
 intro:'Absence de dégagement des épaules après l’expulsion de la tête, qui impose d’autres manœuvres que la traction douce ou la restitution. Fausse dystocie : seule l’épaule antérieure est retenue. Vraie dystocie : les deux épaules sont au-dessus du détroit supérieur. Urgence non prévisible.',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Tête dégagée, épaules qui ne se dégagent pas malgré une traction douce','Fausse dystocie : épaule postérieure dans l’excavation, antérieure retenue','Vraie dystocie : les deux épaules au-dessus du détroit supérieur','Antécédent de dystocie des épaules, macrosomie fœtale','Diabète maternel, obésité maternelle','Travail long, stagnation de la dilatation, extraction instrumentale']},
  {l:'Vérifier — constantes, examen, bilan',u:['Noter l’heure du dégagement de la tête','Patiente bien installée en position gynécologique','Épaule postérieure engagée ou non : elle guide la manœuvre','Côté du dos fœtal (main de l’opérateur pour Jacquemier)','Épisiotomie déjà faite ou non','Une 3e personne présente si possible']},
  {l:'Alerter sans délai',u:['Demander de l’aide, si possible une 3e personne','Échec de McRoberts : appeler l’anesthésiste et le pédiatre','Échec des manœuvres : épisiotomie, puis tout refaire dans le même ordre','Manœuvres invasives (Zavanelli, symphyséotomie, cléidotomie, laparotomie) : dernier recours, médecin','Rester calme, annoncer ce que l’on fait']},
  {l:'Surveiller et tracer',u:['Heure de la tête et heure du corps','Manœuvres faites, dans quel ordre, de quel côté','Examen de l’enfant par le pédiatre','Explications claires aux parents']}],
 steps:['Demander de l’aide, installer la patiente en position gynécologique, garder son calme.',
  'Ne pas tirer de façon excessive sur la tête (ni vers le bas, ni latéralement), pas d’expression utérine, pas de rotations intempestives.',
  'McRoberts : hyperflexion bilatérale des cuisses ± pression sus-pubienne ; traction dans l’axe ombilicococcygien.',
  'Si échec : appeler l’anesthésiste et le pédiatre.',
  'Épaule postérieure engagée : Wood inversée (rotation de 180°). Non engagée : Jacquemier (abaissement du bras postérieur, main du côté du dos fœtal).',
  'Si échec : épisiotomie si elle n’est pas faite, puis refaire les manœuvres dans le même ordre.',
  'En dernier recours, par le médecin : Zavanelli, symphyséotomie, cléidotomie, laparotomie avec hystérotomie.',

 pat:'C’est une urgence : la tête est née mais les épaules sont retenues. Plusieurs personnes vont venir et on vous demandera de bouger les jambes ou de ne plus pousser. Chaque geste vous sera annoncé. Après la naissance, le pédiatre examinera votre bébé et l’équipe vous expliquera ce qui s’est passé.'},

{id:'R15',t:'Réanimation du nouveau-né en salle de naissance',cat:'Natal · Néonatal',
 intro:'Environ 6 à 10 % des nouveau-nés ont besoin d’une assistance à la naissance et 1 % d’une réanimation réelle (ILCOR 2020). Les situations à risque ne sont pas toujours prévisibles : à chaque naissance, une personne capable de ventiler au masque doit être présente.',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Prématuré ?','Absence de respiration spontanée, absence de cri franc','Hypotonie','Apnée ou gasp','Fréquence cardiaque < 100 / min','Difficultés respiratoires ou cyanose persistante']},
  {l:'Vérifier — constantes, examen, bilan',u:['Matériel vérifié avant chaque naissance','Salle à 26-28 °C, table préchauffée, langes chauffés, bonnet','Rôles répartis, équipe briefée','Facteurs de risque : RPM, saignement du 3e trimestre, HTA sévère, diabète, liquide méconial, ARCF','Prématurité < 35 SA, grossesse multiple, RCIU, procidence du cordon','Contact établi avec les soins intensifs néonatals']},
  {l:'Alerter, réanimer',u:['Apnée ou FC < 100 / min : ventilation au masque, idéalement dans les 60 s','FC < 60 / min après 30 s de ventilation efficace : compressions thoraciques','FC < 60 / min malgré 60 s de compressions : adrénaline','Pâleur, pouls faibles, bradycardie : suspecter une hypovolémie','Appeler le pédiatre dès que le risque est identifié']},
  {l:'Surveiller et tracer',u:['FC : auscultation, puis oxymétrie, puis ECG','SpO2 préductale cible : 60 % à 2 min, 70 % à 3, 80 % à 4, 85 % à 5, 90 % à 10 min','Température entre 36,5 et 37,5 °C','Réévaluation toutes les 30 s ; toutes les minutes après adrénaline','Heure de chaque geste, tracée immédiatement']}],
 steps:['Anticiper : matériel, rôles, normothermie. Clampage du cordon après plus de 30 s si aucune réanimation n’est nécessaire (terme, ou prématuré > 28 SA).',
  'Bonne adaptation : peau à peau, soins de routine, surveillance de la respiration, du tonus et de la coloration.',
  'Phase A : sécher, stimuler, tenir au chaud, positionner pour ouvrir les voies aériennes. Pas d’aspiration d’un bébé vigoureux, même si le liquide est méconial.',
  'Phase B : ventilation au masque (FiO2 21 %, 40-60 / min, insufflation ≥ 1 s, pression max 30 cmH2O à terme, 20-25 chez le prématuré). Évaluer après 30 s.',
  'Phase C : si FC < 60 / min après 30 s de ventilation efficace, compressions 3 pour 1 ventilation (90 + 30 par minute), intubation, O2 à 100 %.',
  'Phase D : si FC < 60 / min malgré 60 s, adrénaline IV 10 à 30 µg/kg (0,1 à 0,3 mL/kg, 1 mL + 9 mL de NaCl 0,9 %), toutes les 3 à 5 min, voie ombilicale de préférence.',
  'En attendant la voie ombilicale : voie endotrachéale 50 à 100 µg/kg. Hypovolémie : NaCl 0,9 % ou sang, 10 à 20 mL/kg en 5 à 10 min.',
  'Soins post-réanimation, préparation du transfert néonatal, traçage heure par heure.'],
 pat:'Si votre bébé a besoin d’aide pour respirer, c’est fréquent et l’équipe est prête. Nous restons à côté de vous et nous vous disons ce qui se passe. Dès que son état le permet, il revient contre vous, au chaud.'},

{id:'R16',t:'Déchirures périnéales',cat:'Natal · Périnée',
 intro:'Les déchirures sont recherchées après chaque accouchement, y compris l’examen de la paroi rectale. Classification RCOG-OMS : 1er degré (épithélium vaginal ou vulvaire), 2e (muscles du périnée), 3e a (< 50 % du sphincter externe), 3e b (> 50 %), 3e c (sphincter interne), 4e (muqueuse rectale).',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Examiner le périnée juste après chaque accouchement','Examen de la paroi rectale systématique','Vagin : plaie de l’anneau vulvaire vers l’épine sciatique, souvent postérieure','Col : déchirure à rechercher à l’exposition aux valves','Vulve : déchirure antérieure vers le méat ou le clitoris, saigne beaucoup','Un doute sur une lésion du sphincter : demander un second avis']},
  {l:'Vérifier — constantes, examen, bilan',u:['Inventaire complet : face antérieure du vagin, col, cloison recto-vaginale, périnée','Sonde vésicale : des urines sanglantes évoquent une plaie vésicale','Analgésie ou anesthésie suffisante','Bonne installation, aide, éclairage, valves, tampon dans le fond vaginal','Fils résorbables (0 ou 2-0)','Degré noté selon la classification RCOG-OMS']},
  {l:'Avis médical',u:['Lésion du sphincter anal (3e ou 4e degré) ou doute','Déchirure du col dont la limite supérieure n’est pas visible','Déchirure vaginale avec suspicion de rupture utérine : laparotomie','Urines sanglantes : plaie vésicale','Saignement qui persiste après suture']},
  {l:'Surveiller et tracer',u:['Description détaillée des lésions, du degré et de la réparation','Reprise de la miction (rétention plus fréquente)','Douleur : antalgiques niveau 1 ou 2, AINS','Transit : laxatifs systématiques','Soins locaux : toilette à l’eau, bains de siège']}],
 steps:['Rechercher les déchirures après chaque accouchement, les classer et les décrire.',
  'Installer la patiente : analgésie, éclairage, aide, valves, tampon vaginal.',
  'Lésion du sphincter : une dose de métronidazole IV ; une céphalosporine de 2e génération IV peut s’y associer.',
  'Réparer de haut en bas, en reconstituant les plans anatomiques ; fil résorbable 0 ou 2-0.',
  '1er et 2e degrés : surjet continu si plaie linéaire ; plans séparés avec repères si plaie irrégulière. Sphincter : repérer chaque chef, point en U à résorption lente.',
  '3e et 4e degrés (médecin) : sphincter externe en paletot ou bout à bout ; muqueuse rectale en points séparés ou surjet, de l’angle supérieur vers la marge anale. Peut être différée de quelques heures.',
  'Vaginales : bord à bord en partant du haut. Cervicales : pinces en cœur. Vulvaires : points séparés, fil rapide, sonde près de l’urètre.',
  'Suites : antalgiques, soins locaux, laxatifs, surveillance de la miction ; tout tracer.'],
 pat:'Une douleur du périnée est attendue : elle se soigne, dites-le. Toilette à l’eau avec un savon doux, bains de siège, laxatifs pour éviter la constipation. Signalez une difficulté à uriner ou toute gêne pour retenir les selles ou les gaz.'},

{id:'R17',t:'Mort fœtale in utero',cat:'Périnatal · Deuil',
 intro:'Décès fœtal survenant avant la mise en travail, après 22 SA ou pour un poids de naissance supérieur à 500 g. Le diagnostic est échographique. L’annonce et l’accompagnement des parents font partie du soin.',
 rg:[
  {l:'Reconnaître — ce que je vois, ce qu’on me dit',u:['Absence d’activité cardiaque fœtale à l’échographie','Céphalées, œdèmes, prurit d’apparition récente','Épisode fébrile récent','Antécédent d’HTA, de diabète, de cardiopathie','Chute ou traumatisme dans les jours précédents','Antécédent de fausses couches répétées ou de mort fœtale']},
  {l:'Vérifier — constantes, examen, bilan',u:['TA, prise de poids, œdèmes','NFS, hémostase, CRP, groupe, RAI, test de Kleihauer','Sérologies : parvovirus B19, toxoplasmose, VDRL-TPHA','Glycémie à jeun, TSH-T4, bilan SAPL','Prélèvements cervico-vaginaux, ECBU si besoin','Consultation d’anesthésie et bilan pré-opératoire']},
  {l:'Pronostic maternel en jeu',u:['HRP ou éclampsie','Chorioamniotite avec fièvre','Troubles de l’hémostase','Déclenchement immédiat, voire césarienne selon l’urgence','Présentation transversale proche du terme : césarienne']},
  {l:'Surveiller et tracer',u:['État psychologique de la patiente et du couple','Fièvre, signes d’infection, hémostase','Rétention placentaire fréquente (placenta friable)','Prélèvements après l’expulsion, tracés et étiquetés','Prévention de l’immunisation rhésus si incompatibilité']}],
 steps:['Confirmer à l’échographie ; l’annonce est faite par la sage-femme ou le médecin, dans un lieu calme.',
  'L’hospitalisation dépend de l’état psychologique et du tableau clinique : elle n’est pas obligatoire le jour du diagnostic.',
  'Bilan maternel avant l’accouchement, consultation d’anesthésie, proposition d’une prise en charge psychologique.',
  'Expliquer le devenir du corps, la déclaration, la fœtopathologie ; autopsie avec l’accord des parents (sinon examen externe et IRM).',
  'Déclenchement selon les conditions locales. Respecter la poche des eaux. Avant dilatation complète, pas de manœuvres intempestives : antispasmodiques ou ocytociques si besoin.',
  'Délivrance artificielle puis révision utérine (rétention de caduque fréquente).',
  'Après l’expulsion : inspecter, prélever (membranes, placenta, cordon, orifices fœtaux), histologie placentaire, cytogénétique. Proposer aux parents de voir l’enfant, sans jamais l’imposer ; des photos si refus.',
  'Post-partum : anti-D si besoin, inhibition de la lactation (cabergoline, 2 cp si > 17 SA), contraception, rendez-vous post-natal pour les résultats. Congé de maternité acquis dès 22 SA.'],
 pat:'Nous sommes désolés. Prenez le temps qu’il faut : rien ne presse. Vous pourrez voir votre enfant si vous le souhaitez, ou avoir des photos. Les examens nous aideront peut-être à comprendre ; vous aurez les résultats à la consultation post-natale.'}
);

/* colonnes éditables d'un tableau */
function editableCols(b){
 const n=b.cols.length,lead=Array.isArray(b.rows)?1:0,tail=b.tail?1:0;
 const mid=(!b.tail&&b.sub)?1:0,extra=(!b.tail&&b.sub2)?1:0;
 const start=lead+mid+extra,end=n-tail,out=[];
 for(let c=start;c<end;c++)out.push(c);
 return out;
}
function defKeys(f){
 let tot=0,fill=0;
 f.b.forEach((b,bi)=>{
  if(b.k==='note'){tot++;if(has(f.id+'.n'+bi))fill++}
  else if(b.k==='fields')b.f.forEach((d,fi)=>{tot++;if(has(f.id+'.f'+bi+'.'+fi))fill++});
  else if(b.k==='checks')b.g.forEach((g,gi)=>{tot++;let any=false;g.o.forEach((o,oi)=>{if(has(f.id+'.c'+bi+'.'+gi+'.'+oi))any=true});if(any)fill++});
  else if(b.k==='table'){const n=typeof b.rows==='number'?b.rows:b.rows.length,cols=editableCols(b);
   for(let r=0;r<n;r++)cols.forEach(c=>{tot++;if(has(f.id+'.t'+bi+'.'+r+'.'+c))fill++})}
  else if(b.k==='score'){b.items.forEach((it,ii)=>b.cols.forEach((c,ci)=>{tot++;if(has('s.'+b.id+'.'+ci+'.'+ii))fill++}))}
  else if(b.k==='visa'){[0,1,2].forEach(v=>{tot++;if(has(f.id+'.v'+bi+'.'+v))fill++})}
 });
 return {tot,fill};
}
function fichePct(f){const s=defKeys(f);return s.tot?Math.round(s.fill/s.tot*100):0}

 }else if(b.k==='checks'){
  s+='<div class="chks">'+b.g.map((g,gi)=>'<div class="ckg">'+(g.l?'<div class="l">'+esc(g.l)+'</div>':'')+'<div class="cks">'+g.o.map((o,oi)=>'<label class="ck"><input type="checkbox" data-k="'+fid+'.c'+bi+'.'+gi+'.'+oi+'"><span>'+esc(o)+'</span></label>').join('')+'</div></div>').join('')+'</div>';
 }else if(b.k==='table'){
  const n=typeof b.rows==='number'?b.rows:b.rows.length,labelled=Array.isArray(b.rows);
  const cols=editableCols(b),tailCol=b.tail?b.cols.length-1:-1;

  for(let r=0;r<n;r++){
   s+='<tr>';
   b.cols.forEach((c,ci)=>{
    if(labelled&&ci===0){s+='<td class="rl">'+esc(b.rows[r])+'</td>';return}
    if(!b.tail&&b.sub&&ci===1){s+='<td class="rl" style="background:var(--surface2)">'+esc(b.sub[r]||'')+'</td>';return}
    if(!b.tail&&b.sub2&&ci===2){s+='<td class="rl" style="background:var(--surface2)">'+esc(b.sub2[r]||'')+'</td>';return}
    if(b.tail&&ci===tailCol){s+='<td class="rl" style="background:var(--surface2)">'+esc(b.sub?b.sub[r]||'':'')+'</td>';return}
    if(!cols.includes(ci)){s+='<td class="rl"></td>';return}
    const k=fid+'.t'+bi+'.'+r+'.'+ci;
    if(b.selcol===ci&&b.sels){s+='<td class="ci"><select data-k="'+k+'"><option value="">—</option>'+b.sels.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select></td>'}

   });
   s+='</tr>';
  }
  s+='</tbody></table></div>';
 }else if(b.k==='static'){

  if(b.ul)s+='<ul class="bul">'+b.ul.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
 }else if(b.k==='callout'){

  if(b.p)s+='<div style="margin-bottom:6px">'+esc(b.p)+'</div>';
  if(b.ul)s+='<ul>'+b.ul.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';

 }else if(b.k==='steps'){

  b.items.forEach((it,ii)=>{
   s+='<tr><td class="it">'+esc(it.l)+'</td>';
   b.cols.forEach((c,ci)=>{
    const k='s.'+b.id+'.'+ci+'.'+ii;

   });
   s+='</tr>';
  });
  s+='</tbody></table><div class="tot">Total<span id="sc-'+b.id+'"></span>'+(b.note?'<span class="vd">'+esc(b.note)+'</span>':'')+'</div></div>';
 }else if(b.k==='visa'){
  s+='<div class="visa"><div class="ff"><label>'+(b.lab1||'Visa de l’encadrant')+'</label><input data-k="'+fid+'.v'+bi+'.0"></div>'+
     '<div class="ff"><label>Nom, prénom</label><input data-k="'+fid+'.v'+bi+'.1"></div>'+
     '<div class="ff"><label>Date</label><input type="date" data-k="'+fid+'.v'+bi+'.2"></div></div>';
 }
 s+='</section>';
 return s;
}

   ============================================================ */
function calcSI(){
 const a=$('#si-fc'),b=$('#si-pas'),o=$('#si-out'),t=$('#si-txt');
 if(!a||!b||!o)return;
 const fc=parseFloat(a.value),pas=parseFloat(b.value);
 if(!fc||!pas){o.textContent='—';t.textContent='Renseigner les deux valeurs.';return}
 const i=fc/pas;
 o.textContent=i.toFixed(2).replace('.',',');
 t.textContent=i>=1?'Index ≥ 1 : craindre une perte sanguine significative, même si la TA paraît encore correcte.':'Index < 1 : repère rassurant, à interpréter avec la clinique.';
 o.style.color=i>=1?'var(--warn)':'var(--accent)';
}
function evaOut(){
 const el=$('#eva'),o=$('#eva-out');if(!el||!o)return;
 const v=+el.value;
 const lab=v===0?'Absente':v<=3?'Faible':v<=6?'Modérée':v<=9?'Forte':'Insupportable';
 o.textContent=v+' — '+lab;
}
function calcTerm(){
 const ddr=parseD(($('#m-ddr')||{}).value);
 const sa=$('#m-sa'),dpa=$('#m-dpa');
 if(ddr){
  const dd=diffD(ddr,todayUTC());
  if(sa)sa.textContent=dd<0?'—':(Math.floor(dd/7)+' SA + '+(dd%7)+' j');
  if(dpa)dpa.textContent=fmtD(addD(ddr,287));
 }else{if(sa)sa.textContent='—';if(dpa)dpa.textContent='—'}
 const ed=parseD(($('#m-edate')||{}).value),w=parseInt(($('#m-esa')||{}).value||'0',10),j=parseInt(($('#m-ej')||{}).value||'0',10);
 const d2=$('#m-dpa2');
 if(d2)d2.textContent=(ed&&w>0)?fmtD(addD(ed,280-(w*7+(j||0)))):'—';
}
function calcBMI(){
 const p=parseFloat(($('#m-poids')||{}).value),t=parseFloat(($('#m-taille')||{}).value);
 const o=$('#m-imc'),g=$('#m-gain');if(!o||!g)return;
 if(!(p>0)||!(t>50)){o.textContent='—';g.textContent='Renseigner le poids et la taille.';return}
 const v=p/Math.pow(t/100,2);
 o.textContent=v.toFixed(1).replace('.',',');
 let gain='12,5 à 18 kg',cat='Insuffisance pondérale';
 if(v>=30){gain='5 à 9 kg';cat='Obésité'}
 else if(v>=25){gain='7 à 11,5 kg';cat='Surpoids'}
 else if(v>=18.5){gain='11,5 à 16 kg';cat='Poids normal'}
 g.textContent=cat+' — prise de poids conseillée sur la grossesse : '+gain+'.';
}
function abFilter(q){
 const s=q.trim().toLowerCase();
 $$('#abrs .abr-l').forEach(el=>{el.style.display=(!s||el.getAttribute('data-s').indexOf(s)>=0)?'':'none'});
}

   ============================================================ */
const IDX=()=>[].concat(
 CF.map(f=>({no:f.id,t:f.t,ty:'Fiche',go:function(){go('fiche',f.id)}})),
 CR.map(r=>({no:r.id,t:r.t,ty:'Risque',go:function(){go('risque',r.id)}})),
 [{no:'II',t:'Carte de tri — repérer, alerter, orienter',ty:'Outil',go:function(){go('tri')}},
  {no:'II',t:'Les cinq gestes qui précèdent',ty:'Outil',go:function(){go('tri')}},
  {no:'III',t:'Score de Bishop',ty:'Outil',go:function(){go('annexes')}},
  {no:'III',t:'Index de choc',ty:'Outil',go:function(){go('annexes')}},
  {no:'III',t:'Valeurs de référence',ty:'Outil',go:function(){go('annexes')}},
  {no:'III',t:'Abréviations et vocabulaire',ty:'Outil',go:function(){go('annexes')}},
  {no:'IV',t:'Notes libres',ty:'Outil',go:function(){go('notes')}},
  {no:'V',t:'Calcul du terme et de la DPA',ty:'Outil',go:function(){go('memo')}},
  {no:'V',t:'Médicaments de la salle de naissance',ty:'Outil',go:function(){go('memo')}}]
);
let kbRes=[];
function openKb(){$('#kb').classList.add('on');$('#kq').value='';kbFilter('');setTimeout(()=>$('#kq').focus(),40)}
function closeKb(){$('#kb').classList.remove('on')}
function kbFilter(q){
 const s=q.trim().toLowerCase();
 kbRes=IDX().filter(x=>!s||(x.t+' '+x.no+' '+x.ty).toLowerCase().indexOf(s)>=0).slice(0,14);
 $('#kbl').innerHTML=kbRes.length?kbRes.map((x,i)=>'<button class="kbi'+(i===0?' sel':'')+'" data-i="'+i+'"><span class="no">'+esc(x.no)+'</span><span>'+esc(x.t)+'</span><span class="ty">'+esc(x.ty)+'</span></button>').join(''):'<div class="empty" style="padding:18px 14px">Aucun résultat</div>';
}

/* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
function onEdit(e){
 const el=e.target;
 if(el.id==='abf'){abFilter(el.value);return}
 const k=el.getAttribute&&el.getAttribute('data-k');
 if(k){
  D.data[k]=el.type==='checkbox'?!!el.checked:el.value;
  save();
  if(el.closest('.sc'))scoreTotals();
  if(k.indexOf('p.')===0)printName();
  if(route.v==='fiche')ficheProgress(); else updateGlobal();
 }
 if(el.id==='eva')evaOut();
 const c=el.getAttribute&&el.getAttribute('data-calc');
 if(c==='si')calcSI();else if(c==='term')calcTerm();else if(c==='bmi')calcBMI();
}
document.addEventListener('input',onEdit);
document.addEventListener('change',onEdit);
document.addEventListener('click',e=>{
 const ki=e.target.closest('.kbi');
 if(ki){const x=kbRes[+ki.getAttribute('data-i')];if(x){closeKb();x.go()}return}
 const g=e.target.closest('[data-go]');
 if(g){go(g.getAttribute('data-go'));return}
 const f=e.target.closest('[data-fiche]');
 if(f){go('fiche',f.getAttribute('data-fiche'));return}
 const r=e.target.closest('[data-risque]');
 if(r){go('risque',r.getAttribute('data-risque'));return}
 const d=e.target.closest('[data-done]');
 if(d){
  const id=d.getAttribute('data-done');
  D.done[id]=!D.done[id];persist();
  d.classList.toggle('on',!!D.done[id]);
  nav();updateGlobal();
  if(route.v==='home')renderHome();
  toast(D.done[id]?'Fiche marquée comme terminée':'Fiche rouverte');
  return;
 }
 const del=e.target.closest('[data-delnote]');
 if(del){
  if(confirm('Supprimer cette page de notes ?')){
   D.notes=D.notes.filter(x=>x.id!==del.getAttribute('data-delnote'));persist();renderNotes();toast('Page supprimée');
  }
  return;
 }
 const add=e.target.closest('[data-addnote]');
 if(add){
  D.notes.push({id:'n'+Date.now(),t:'',b:'',d:todayISO()});persist();renderNotes();
  const ins=$$('.note input');if(ins.length)ins[ins.length-1].focus();
  return;
 }
});

/* ============================================================
   THÈME · SAUVEGARDE
   ============================================================ */
const prefersDark=function(){try{return window.matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}};
function applyTheme(){
 const t=D.ui.theme;
 if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');
 const dark=t?t==='dark':prefersDark();
 const b=$('#theme');if(b)b.textContent=dark?'Clair':'Sombre';
}
function exportJSON(){
 const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='carnet-sage-femme-'+todayISO()+'.json';
 document.body.appendChild(a);a.click();a.remove();
 toast('Sauvegarde téléchargée');
}
function importJSON(e){
 const f=e.target.files&&e.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=function(){
  try{
   const o=JSON.parse(rd.result);
   if(!confirm('Remplacer les données de ce carnet par cette sauvegarde ?')){e.target.value='';return}
   D=Object.assign({profil:{},data:{},done:{},seen:{},notes:[],ui:{}},o);
   persist();applyTheme();render();toast('Sauvegarde restaurée');
  }catch(err){toast('Fichier illisible')}
 };
 rd.readAsText(f);e.target.value='';
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
function init(){
 load();
 try{
  if(window.self!==window.top){
   document.body.classList.add('embed');
   try{const pt=window.parent.document.documentElement.getAttribute('data-theme');if(pt&&!D.ui.theme)D.ui.theme=pt}catch(e){}
  }
 }catch(e){document.body.classList.add('embed')}
 applyTheme();
 $('#flist').innerHTML=CF.map(f=>'<button class="fv" data-fiche="'+f.id+'"><span class="no">'+f.id+'</span><span class="tx">'+esc(f.t)+'</span><span class="dot"></span></button>').join('');
 const hh=(location.hash||'').replace('#','');
 if(hh.indexOf('f/')===0)route={v:'fiche',id:hh.slice(2)};
 else if(hh.indexOf('r/')===0)route={v:'risque',id:hh.slice(2)};
 else if(['risques','tri','annexes','notes','memo'].indexOf(hh)>=0)route={v:hh,id:null};
 render();
 $('#theme').onclick=function(){
  const dark=D.ui.theme?D.ui.theme==='dark':prefersDark();
  D.ui.theme=dark?'light':'dark';persist();applyTheme();toast(dark?'Thème clair':'Thème sombre');
 };
 $('#exp').onclick=exportJSON;
 $('#imp').onclick=function(){$('#fileIn').click()};
 $('#fileIn').onchange=importJSON;
 $('#pr').onclick=function(){window.print()};
 $('#menu').onclick=function(){$('#side').classList.toggle('open')};
 $('#q').addEventListener('focus',function(){this.blur();openKb()});
 $('#kq').addEventListener('input',function(){kbFilter(this.value)});
 $('#kq').addEventListener('keydown',function(ev){
  if(ev.key==='Enter'){ev.preventDefault();if(kbRes[0]){const x=kbRes[0];closeKb();x.go()}}
 });
 $('#kb').addEventListener('click',function(ev){if(ev.target.id==='kb')closeKb()});
 document.addEventListener('keydown',function(ev){
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();openKb()}
  else if(ev.key==='Escape')closeKb();
 });
 window.addEventListener('beforeunload',persist);
}
init();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
</body>
